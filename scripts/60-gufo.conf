# /etc/systemd/system/llama-flashnext.service.d/60-gufo.conf
#
# Sustituye el motor de llama-flashnext.service por Gufo 0.17.0 (H-049) SIN cambiar
# el nombre de la unidad: llama-guard, brush-server (_liberar_ram) y los scripts de
# reparacion siguen haciendo `systemctl stop/start llama-flashnext` y Hermes sigue
# llamando a :8080 con el modelo `qwen3.8-flash-next` y la misma clave.
#
# Volver a llama.cpp: borrar este fichero, `systemctl daemon-reload` y
# `systemctl restart llama-flashnext`.
#
# - Imagen fijada por digest (la medida en H-049), no :latest.
# - UD-Q4_K_XL: Gufo no carga la UD-IQ4_XS (tensores IQ3_S, H-047).
# - mmproj BF16: Gufo rechaza el F16 (H-049).
# - --cache-ram-bytes 4 GiB (en H-049 con 8 GiB la RAM libre bajo a 5,3 GB; brush y
#   ComfyUI conviven en esta maquina).
# - Gufo 0.17.0 solo acepta UNA clave: con --api-key repetido vale solo la ULTIMA
#   (H-050b). Se pasa la PRIMERA linea util de api-keys.txt, que es la de Hermes y
#   LiteLLM; el cliente de la segunda clave pierde el acceso con este motor.
#   Va en argv: visible en /proc/<pid>/cmdline para usuarios locales del M5.
# - Rootless como lasso (Linger=yes): podman necesita XDG_RUNTIME_DIR.

[Service]
Environment=XDG_RUNTIME_DIR=/run/user/1000
Environment=GUFO_IMG=ghcr.io/gufo-org/toolboxes/gufo-runtime@sha256:a3df87bca3d33aef3df6f5c509ee54f743c0cb6e2cb5dbc83f2ebac2289349d2
ExecStartPre=-/usr/bin/podman rm -f gufo-flashnext
ExecStart=
ExecStart=/bin/bash -c '\
  M=/models/gguf/qwen38-flash-next; \
  CLAVE=; while IFS= read -r k; do k="$${k//[[:space:]]/}"; [ -n "$$k" ] && [ "$${k:0:1}" != "#" ] && { CLAVE=$$k; break; }; done < /etc/llama-server/api-keys.txt; \
  [ -n "$$CLAVE" ] || { echo "sin clave en api-keys.txt" >&2; exit 1; }; \
  exec /usr/bin/podman run --rm --name gufo-flashnext \
    --device /dev/kfd --device /dev/dri --group-add keep-groups \
    --ulimit memlock=-1 --security-opt label=disable \
    -v /models:/models:ro -p 0.0.0.0:8080:8080 "$GUFO_IMG" \
    gufo serve --host 0.0.0.0 --port 8080 --sessions 2 --api-key "$$CLAVE" llm \
      -m $$M/UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf \
      --mmproj $$M/mmproj-BF16.gguf \
      --mtp-model $$M/MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf --speculative mtp \
      --context 262144 --cache-ram-bytes 4294967296 \
      --served-model-name qwen3.8-flash-next'
ExecStop=/usr/bin/podman stop -t 30 gufo-flashnext
